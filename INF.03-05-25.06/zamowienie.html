<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotografia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <header id="baner">
        <h1>Fotografia artystyczna</h1>
    </header>

    <section id="obrazki">

        <img src="1.jpg" alt="obrazy do sprzedaży" title="1.jpg">
        <img src="2.jpg" alt="obrazy do sprzedaży" title="2.jpg">
        <img src="3.jpg" alt="obrazy do sprzedaży" title="3.jpg">
        <img src="4.jpg" alt="obrazy do sprzedaży" title="4.jpg">
        <img src="5.jpg" alt="obrazy do sprzedaży" title="5.jpg">
        <img src="6.jpg" alt="obrazy do sprzedaży" title="6.jpg">
        <img src="7.jpg" alt="obrazy do sprzedaży" title="7.jpg">
        <img src="8.jpg" alt="obrazy do sprzedaży" title="8.jpg">
        <img src="9.jpg" alt="obrazy do sprzedaży" title="9.jpg">
        <img src="10.jpg" alt="obrazy do sprzedaży" title="10.jpg">

    </section>

    <main>

        <section id="lewy">

            <h3>Zamówienie</h3>
            <label for="obraz">Wybierz obraz:</label>
            <input type="file" name="obraz" id="obraz" accept="image/jpeg">
            <br>
            <label for="kopie">Liczba kopii:</label>
            <input type="number" id="kopie" min="1">
            <br>
            <label>
                <input type="radio" name="papier" value="blyszczacy" checked>
                Papier Błyszczący
            </label>
            <br>
            <label>
                <input type="radio" name="papier" value="matowy">
                Papier Matowy
            </label>
            <br>
            <button type="button" onclick="dodaj()">Dodaj do koszyka</button>



        </section>

        <section id="prawy">

            <nav id="nav">
                <ul>
                    <li><a href="regulamin.html">Regulamin</a></li>
                    <li><a href="uslugi.html">Usługi</a></li>
                    <li><a href="https://pixabay.com">Zdjęcia</a></li>
                </ul>
            </nav>
            <section id="prawa-tresc">
                <h3>Koszyk</h3>
                <div id="skrypt"></div>
            </section>
                     
        </section>

    </main>

    <footer id="stopka">
         <p>Autor strony: <em><a href="https://ee-informatyk.pl/" target="_blank" style="text-decoration: none;color:unset;">DJ</a></em></p>
    </footer>


</body>
<script>
    
    function dodaj(){
        let obraz=document.getElementById("obraz").files[0];
        let sciezka=URL.createObjectURL(obraz)
        let kopie=Number(document.getElementById("kopie").value)
        let papier=document.querySelector("input[name='papier']:checked").value
        let wynik=document.getElementById("skrypt")
        //let prawy=document.getElementById("prawa-tresc")
        //let nazwaPliku=obraz.files[0].name
        let plik=document.createElement("img")
        plik.src=sciezka;

        if(papier==="blyszczacy"){
            let cena = 2* kopie
            wynik.appendChild(plik)
            let p=document.createElement("p")
            wynik.appendChild(p)
            URL.revokeObjectURL(obraz)
             p.innerHTML="Liczba kopii: "+ kopie + "<br>" + "Cena: " + cena
             
        }

        if(papier==="matowy"){
            let cena =3 * kopie
            wynik.appendChild(plik)
            let p=document.createElement("p")
            wynik.appendChild(p)
            URL.revokeObjectURL(obraz)
             p.innerHTML="Liczba kopii: "+ kopie + "<br>" + "Cena: " + cena
        }
        
        
    }

</script>
</html>
